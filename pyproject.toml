[project]
name = "learning"
version = "1.0.0"
description = "Download and process NSE Bhavcopy data locally in English"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas==2.2.3",
    "requests==2.32.3",
    "ta-lib==0.6.8",
    "yfinance==1.4.0",
    "pyarrow==19.0.1",
    "pandas-market-calendars==5.4.0",
    "rich>=13.9.4,<14.0.0",
    "tabulate==0.10.0",
    "selenium==4.44.0",
    "webdriver-manager==4.1.1",
    "scikit-learn==1.8.0",
    "vectorbt==1.0.0",
    "arch==7.0.0",
    "statsmodels>=0.14.6",
    "duckdb==1.1.3",
    "structlog==25.5.0",
    "streamlit==1.40.0",
    "backtesting>=0.6.5",
    "python-telegram-bot>=22.7",
    "xgboost>=3.2.0",
    "tensorflow>=2.20.0",
    "polars>=2.0.0",
    "streamlit-option-menu>=0.4.0",
    "scipy>=1.17.1",
    "powernse>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "ruff==0.4.9",
    "mypy==1.10.0",
    "types-requests==2.32.0.20240602",
]

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = ["_archive", "data", ".venv", "vendor"]
# Silence third-party warnings that we cannot fix from our code.
# Module-scoped so we don't accidentally hide the same warning from our
# own modules in the future.
filterwarnings = [
    # advanced_ta/LorentzianClassification/Classifier.py:401
    # uses ~bool (bitwise inversion), deprecated in Python 3.13, removed in 3.16.
    # Upstream fix pending. Tracked at:
    # https://github.com/hudson-and-thames/advanced-ta (as of Oct 2026 — not yet patched)
    "ignore:Bitwise inversion '~' on bool is deprecated.*:DeprecationWarning:advanced_ta.*",
    # sklearn/utils/_array_api.py:794,814 emits RuntimeWarning when it
    # receives an all-NaN feature window (Lorentzian KNN with insufficient bars).
    # This is expected behavior for cold-start windows; the test suite covers
    # the fixed path via warm-up. Filtering at module scope only.
    "ignore:All-NaN slice encountered:RuntimeWarning:sklearn.*",
]

[tool.app]
raw_dir = "data/raw"
processed_dir = "data/processed"
max_days_back = 7
top_n_stocks = 250
bottom_out_tolerance = 0.5
bounce_buffer = 1.0

[tool.sharegenius.scanner]
max_workers = 0  # 0 = auto (CPU count)
symbols_per_worker = 50

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    "_archive",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E402",   # module-level import not at top — intentional in Streamlit + CLI entry files
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = [
    '_archive',
    'src/dashboard',
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
implicit_reexport = false
strict_equality = true
ignore_missing_imports = true
